name: Validate studies
on:
  pull_request:
    branches: [main]
    paths:
      - "studies/**"
      - "scripts/build_studies_index.py"
      - "scripts/verify_study.sh"
      - "scripts/check_contributors.py"
      - "community/**"
      - "scripts/research/protocols.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changed-study diff below needs the PR's merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build studies index
        run: python scripts/build_studies_index.py
      - name: Verify changed studies
        run: |
          # Find study directories changed in this PR.
          # A failed diff must fail the job, never read as "no studies changed".
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- studies/)
          CHANGED_STUDIES=$(printf '%s\n' "$CHANGED_FILES" | grep -oP 'studies/[^/]+' | sort -u || true)
          if [ -z "$CHANGED_STUDIES" ]; then
            echo "No study directories changed."
            exit 0
          fi
          for study_path in $CHANGED_STUDIES; do
            if [ ! -d "$study_path" ]; then
              echo "Study directory removed or moved: $study_path"
              continue
            fi
            study_id=$(basename "$study_path")
            echo "--- Verifying $study_id ---"
            bash scripts/verify_study.sh "$study_id"
            echo ""
          done
      - name: Test study discovery and persistent playground integration
        run: python -m pytest tests/test_build_studies_index.py tests/test_playground.py tests/test_genius_integration.py -o addopts='' -q
      - name: Verify contributor attribution
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attribution credits people who submit studies. Maintainer edits to existing studies
          # (admin or maintain permission on this repository) do not add the maintainer as a contributor.
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$PR_AUTHOR/permission" --jq .role_name 2>/dev/null || echo none)
          if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "maintain" ]; then
            echo "Maintainer PR ($PERMISSION): contributor attribution not required."
            exit 0
          fi
          # A failed diff must fail the job, never read as "no studies changed".
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- studies/ community/)
          CHANGED_STUDIES=$(printf '%s\n' "$CHANGED_FILES" | grep -oP '^studies/[^/]+|^community/paper_[a-f0-9]+/revisions/[a-f0-9]{64}' | sort -u || true)
          if [ -z "$CHANGED_STUDIES" ]; then
            exit 0
          fi
          # Same rule for legacy index.json and protocol study.json (V080 B2); a dir with neither is skipped.
          python scripts/check_contributors.py --author "$PR_AUTHOR" $CHANGED_STUDIES

  # V080-PLATFORM §2.1: a maintainer release PR adds files under community/**. Every changed revision that
  # holds protocol.json is checked with the hsenv engine. This job runs the PR's own checker
  # (scripts/research/protocols.py), its tests and its requirements.txt hsenv pin, so a PR can change its own
  # checks: it has no secrets, a read-only token and a time limit, and reviewers must look at any change to
  # those files. Protocol files themselves are read as data by the engine.
  validate-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned engine
        # hsenv pin lives only in requirements.txt: hsenv @ git+https://github.com/HumanStudy-Hub/hsenv@db85a9c82f4c7cedeb808a3d39ae2858605d5a20  # v0.8.1
        run: |
          pip install jsonschema==4.26.0 pytest==8.4.2
          grep '^hsenv' requirements.txt > "$RUNNER_TEMP/hsenv-pin.txt" && pip install -r "$RUNNER_TEMP/hsenv-pin.txt"
      - name: Validate changed protocol releases
        run: |
          # A failed diff must fail the job, never read as "no revisions changed".
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- community/)
          REVISIONS=$(printf '%s\n' "$CHANGED_FILES" | grep -oP '^community/paper_[a-f0-9]+/revisions/[a-f0-9]{64}' | sort -u || true)
          DIRS=""
          for rev in $REVISIONS; do
            if [ -f "$rev/protocol.json" ]; then DIRS="$DIRS $rev"; fi
          done
          if [ -z "$DIRS" ]; then
            echo "No protocol releases changed."
            exit 0
          fi
          python -m scripts.research.protocols --sessions 300 $DIRS
      - name: Test the protocol release rules
        run: python -m pytest tests/test_protocol_release.py tests/test_check_contributors.py tests/test_hsenv_pin.py -o addopts='' -q

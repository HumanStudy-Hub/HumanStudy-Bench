name: Build HumanStudy package with Claude Code
# The job ID in the run title lets the web app match a run to its job
# (no web code does this yet).
run-name: Build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private jobs repository job ID
        required: true
        type: string
      jobs_repo:
        description: Private repository containing job inputs and outputs
        required: true
        default: HumanStudy-Hub/humanstudy-hub-jobs
        type: string

permissions:
  contents: read

concurrency:
  group: humanstudy-agent-${{ inputs.job_id }}
  cancel-in-progress: true

jobs:
  build-study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out package contract and validation tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out private job storage
        id: storage
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.jobs_repo }}
          token: ${{ secrets.HUMANSTUDY_PIPELINE_TOKEN }}
          path: job-storage
          ref: jobs/${{ inputs.job_id }}
          persist-credentials: false

      - name: Set up runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python utilities
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code and document tools
        run: |
          npm install --global @anthropic-ai/claude-code@latest
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr jq unzip

      # The package's evaluation must compute the paper's own tests (ANOVA,
      # regressions, Welch or pooled t), and the replay runtime (run-playground.yml)
      # installs the same libraries, so the build and its checks have them too.
      - name: Install statistics libraries
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 pandas==2.2.3 statsmodels==0.14.4

      # The web app uploads the paper straight to Vercel Blob, because a Vercel
      # function request body caps out at 4.5 MB. Older jobs already carry the PDF.
      - name: Fetch the uploaded paper
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          job = Path("job-storage/jobs") / os.environ["JOB_ID"]
          paper = job / "input" / "paper.pdf"
          if paper.exists():
              raise SystemExit(0)
          url = json.loads((job / "job.json").read_text()).get("paperUrl")
          if not url:
              raise SystemExit("job.json has no paperUrl and no paper.pdf is stored.")
          paper.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(url, timeout=120) as response:
              paper.write_bytes(response.read())
          print(f"Downloaded {paper.stat().st_size} bytes")
          PY

      - name: Mark job running
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("job-storage/jobs") / os.environ["JOB_ID"] / "job.json"
          data = json.loads(path.read_text())
          request_path = path.with_name("studio_request.json")
          mode = json.loads(request_path.read_text()).get("mode", "build") if request_path.exists() else "build"
          # The paper is on disk by now; its signed download link must not be committed.
          data.pop("paperUrl", None)
          data.update({
              "status": "running",
              "currentStage": 1,
              "packageReady": False,
              "message": "Claude Code is discussing the study" if mode == "discuss" else "Our agent is extracting the paper and building the study",
          })
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish running state
        working-directory: job-storage
        env:
          JOB_ID: ${{ inputs.job_id }}
          TOKEN: ${{ secrets.HUMANSTUDY_PIPELINE_TOKEN }}
        run: |
          remote="https://x-access-token:$TOKEN@github.com/${{ inputs.jobs_repo }}.git"
          git config user.name "HumanStudy-Hub Agent"
          git config user.email "pipeline@humanstudy-hub.org"
          git add "jobs/$JOB_ID/job.json"
          git commit -m "agent: start $JOB_ID"
          # Losing this push loses the whole build, so a branch that moved under
          # us is rebased onto rather than treated as a failure.
          for attempt in 1 2 3; do
            if git push "$remote" "HEAD:jobs/$JOB_ID"; then exit 0; fi
            git pull --rebase "$remote" "jobs/$JOB_ID"
          done
          echo "Could not publish the running state after three attempts." >&2
          exit 1

      - name: Run Claude Code through OpenRouter
        env:
          JOB_ID: ${{ inputs.job_id }}
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5' }}
          AGENT_TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '25' }}
          # Part of AGENT_TIMEOUT_MINUTES held back for the validator repair loop.
          AGENT_REPAIR_RESERVE_MINUTES: ${{ vars.AGENT_REPAIR_RESERVE_MINUTES || '8' }}
          PIPELINE_PROGRESS_TOKEN: ${{ secrets.HUMANSTUDY_PIPELINE_TOKEN }}
        run: |
          job="$GITHUB_WORKSPACE/job-storage/jobs/$JOB_ID"
          mkdir -p "$job/logs"
          python agent_pipeline/build_prompt.py \
            --contract agent_pipeline/CLAUDE.md \
            --job "$job" \
            --output "$job/agent-prompt.md"
          python agent_pipeline/run_agent.py \
            --job "$job" \
            --prompt "$job/agent-prompt.md" \
            --model "$OPENROUTER_MODEL" \
            --validator agent_pipeline/validate_package.py \
            --timeout-minutes "$AGENT_TIMEOUT_MINUTES" \
            --check-interval 10 \
            --progress-repo "${{ inputs.jobs_repo }}" \
            --progress-branch "jobs/$JOB_ID" \
            --progress-path "jobs/$JOB_ID/progress.json"

      # The agent worked inside the checkout above. Validate with a fresh copy of
      # the pipeline code, so nothing it edited or planted there (including git
      # hooks) takes part in publishing.
      - name: Check out clean pipeline code
        if: success()
        uses: actions/checkout@v4
        with:
          path: pipeline-clean
          persist-credentials: false

      - name: Validate result and prepare review
        if: success()
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          job="job-storage/jobs/$JOB_ID"
          python pipeline-clean/agent_pipeline/finalize_job.py "$job" pipeline-clean/agent_pipeline/validate_package.py

      # Without job storage there is nowhere to record the failure: the token that
      # failed to check out the jobs branch is the only one that can push to it.
      # The run itself still fails, so it shows up in the Actions run list.
      - name: Report unavailable job storage
        if: always() && steps.storage.outcome == 'failure'
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          msg="Could not check out job storage (branch jobs/$JOB_ID). The HUMANSTUDY_PIPELINE_TOKEN secret is most likely expired or invalid, or the job branch does not exist. The job state was not updated."
          echo "::error title=Job storage unavailable::$msg"
          echo "### Job storage unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Mark failed or cancelled
        if: (failure() || cancelled()) && steps.storage.outcome == 'success'
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = Path("job-storage/jobs") / os.environ["JOB_ID"]
          path = job / "job.json"
          if not path.exists():
              print(f"::error::{path} is missing, so the failure could not be recorded on the job branch.")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          request_path = job / "studio_request.json"
          mode = json.loads(request_path.read_text()).get("mode", "build") if request_path.exists() else "build"
          for key in ("paperUrl", "openMaterialsUrl"):  # signed links are not committed
              data.pop(key, None)
          data.update({
              "status": "failed",
              "packageReady": False,
              "message": "The Studio discussion failed or was cancelled" if mode == "discuss" else "The study build failed or was cancelled",
          })
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      # The agent could write into job-storage/.git (hooks, URL rewrites), so the
      # job folder is published from a fresh clone with hooks disabled.
      - name: Commit job state and outputs
        if: always() && steps.storage.outcome == 'success'
        env:
          JOB_ID: ${{ inputs.job_id }}
          TOKEN: ${{ secrets.HUMANSTUDY_PIPELINE_TOKEN }}
        run: |
          if [ ! -d "job-storage/jobs/$JOB_ID" ]; then
            echo "::error::jobs/$JOB_ID does not exist on the job branch; nothing to commit."
            exit 1
          fi
          remote="https://x-access-token:$TOKEN@github.com/${{ inputs.jobs_repo }}.git"
          publish="$RUNNER_TEMP/job-publish"
          rm -rf "$publish"
          git -c core.hooksPath=/dev/null clone --quiet --depth 1 --branch "jobs/$JOB_ID" "$remote" "$publish"
          rm -rf "$publish/jobs/$JOB_ID"
          mkdir -p "$publish/jobs"
          cp -R "job-storage/jobs/$JOB_ID" "$publish/jobs/$JOB_ID"
          find "$publish/jobs/$JOB_ID" -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$publish/jobs/$JOB_ID" -name '*.pyc' -type f -delete 2>/dev/null || true
          cd "$publish"
          # progress.json is updated through the API during the run; keep the branch's copy.
          git checkout HEAD -- "jobs/$JOB_ID/progress.json" 2>/dev/null || true
          git config user.name "HumanStudy-Hub Agent"
          git config user.email "pipeline@humanstudy-hub.org"
          git add -A "jobs/$JOB_ID"
          git -c core.hooksPath=/dev/null commit -m "agent: build study for $JOB_ID" || true
          for attempt in 1 2 3; do
            if git -c core.hooksPath=/dev/null push "$remote" "HEAD:jobs/$JOB_ID"; then exit 0; fi
            git -c core.hooksPath=/dev/null pull --rebase "$remote" "jobs/$JOB_ID"
          done
          echo "Could not publish the job after three attempts." >&2
          exit 1

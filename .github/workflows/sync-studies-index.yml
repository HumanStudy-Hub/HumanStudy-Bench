name: Sync studies index
on:
  push:
    branches: [main]
    paths:
      - "studies/**"
      - "scripts/build_studies_index.py"
      - "scripts/research/**"
      - "catalog/**"
      - "community/**"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned protocol engine
        # effects_core is hsenv's (V080 B1). hsenv pin lives only in requirements.txt: hsenv @ git+https://github.com/HumanStudy-Hub/hsenv@db85a9c82f4c7cedeb808a3d39ae2858605d5a20  # v0.8.1
        run: grep '^hsenv' requirements.txt > "$RUNNER_TEMP/hsenv-pin.txt" && pip install -r "$RUNNER_TEMP/hsenv-pin.txt"
      - name: Build studies index
        run: python scripts/build_studies_index.py
      - name: Commit updated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild studies_index.json"
          file_pattern: co_website/data/studies_index.json co_website/data/research_index.json

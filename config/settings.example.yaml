# Copy this file to config/settings.yaml and edit as needed.
# Do not commit config/settings.yaml if it contains secrets.
# The real settings files are ignored by .gitignore:
#   config/settings.yaml, config/settings.yml, config/settings.json

# Global fallback LLM. Any stage-specific section below can override it.
llm:
  # provider: openai | google | anthropic | openrouter | vllm
  provider: openai

  # The model name sent to the selected provider.
  model: gpt-4o

  # Optional. Prefer environment variables for shared machines, but local
  # config/settings.yaml may also hold a key because it is gitignored.
  # Provider env alternatives:
  #   OPENAI_API_KEY, GOOGLE_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY
  api_key: null

  # Optional. If null, the provider default is used:
  # openai     -> https://api.openai.com/v1
  # google     -> https://generativelanguage.googleapis.com/v1beta/openai/
  # anthropic  -> https://api.anthropic.com
  # openrouter -> https://openrouter.ai/api/v1
  # vllm       -> http://localhost:8000/v1
  base_url: null

# Stage-specific LLM settings. Leave fields null to inherit from llm when the
# provider matches; if provider differs, use that provider's env/defaults.
stage1_llm:
  provider: null
  model: null
  api_key: null
  base_url: null

stage2_llm:
  provider: null
  model: null
  api_key: null
  base_url: null

# Stage 3 patching can use a cheaper model than Stage 1/2.
stage3_llm:
  provider: openai
  model: gpt-4o-mini
  api_key: null
  base_url: null

# Stage 4 HumanStudy-Bench package/config generation. If this is not configured,
# Stage 4 can still emit a deterministic data/studies/<study_id> JSON package,
# but it will skip or fallback from LLM-generated study adapters.
stage4_llm:
  provider: null
  model: null
  api_key: null
  base_url: null

# Stage 5 HumanStudy-Bench participant simulation. This can intentionally use a
# different provider/model/key/base_url from the extraction/config LLM above.
stage5_llm:
  provider: null
  model: null
  api_key: null
  base_url: null

# Backward-compatible alias for Stage 5.
agent_llm:
  provider: null
  model: null
  api_key: null
  base_url: null

paths:
  output_dir: generation_pipeline/outputs
  # HumanStudy-Bench-Hub stores studies directly under ./studies.
  data_dir: .
  runs_dir: runs

verification:
  threshold: 90

stage5:
  # If null, Stage 5 uses the study adapter/specification participant count.
  n_participants: null
  n_agents: null
  # Optional list of adapter-declared sub-study IDs. Scoped runs are written
  # under runs/<study_id>/scope_<sub_study_id>/.
  sub_studies: null

  # Explicit cost cap for n_participants/n_agents.
  max_agents: null

  repeats: 1
  temperature: 1.0
  seed: 42
  num_workers: null
  use_cache: false
  cache_dir: null
  profiles_json: null
  system_prompt_file: null
  system_prompt_preset: v3_human_plus_demo
  reasoning: default
  enable_reasoning: false
